name: VARS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Bash validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Validate syntax
        run: |
          bash -n vars.sh
          bash -n tests/test_cli.sh tests/test_runtime.sh tests/test_inventory.sh tests/test_pipeline.sh

      - name: Run tests
        run: |
          bash tests/test_cli.sh
          bash tests/test_runtime.sh
          bash tests/test_inventory.sh
          bash tests/test_pipeline.sh

      - name: Run ShellCheck
        run: |
          shellcheck -x vars.sh tests/test_cli.sh tests/test_runtime.sh tests/test_inventory.sh tests/test_pipeline.sh
